# Classification: INTERNAL
[project]
name = "netbox-tool-kits"
version = "0.1.0"
description = "Internal Django app for populating NetBox from spreadsheets (create-only)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "netbox-snapshots"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "RUF"]
# The spec and its prose use en/em dashes and typographic quotes; docstrings quote them verbatim.
allowed-confusables = ["–", "—", "’", "“", "”"]

[tool.ruff.lint.per-file-ignores]
"config/settings_test.py" = ["F403", "F405"]
# Migrations are generated by Django and edited only to add the classification header.
"importer/migrations/*" = ["E501", "RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests", "importer/tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
